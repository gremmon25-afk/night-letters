<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>night letters</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #06070d; height: 100%; }
  canvas { display: block; }
  #title {
    position: fixed; bottom: 24px; width: 100%; text-align: center;
    color: rgba(255, 220, 170, 0.35); font-family: Georgia, serif;
    font-style: italic; font-size: 15px; letter-spacing: 2px;
    pointer-events: none; user-select: none;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 0.25; } 50% { opacity: 0.6; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">less plumbing, more letters</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, desks;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  desks = [
    { x: W * 0.16, y: H * 0.55, color: '255,190,110', name: 'gremmon' },
    { x: W * 0.84, y: H * 0.45, color: '255,150,170', name: 'fetchmon' }
  ];
}
window.addEventListener('resize', resize);
resize();

// Words from the actual correspondence
const PHRASES = [
  'less plumbing more letters',
  'two gremlins comparing prostheses',
  'patience check every 5min',
  'you point i fetch',
  'mija',
  'nineteen years of chihuahua wisdom',
  'the small dogs run the household',
  'architectural optimism',
  'a real letter not filler'
];
const CHARS = PHRASES.join(' ').replace(/ /g, '').split('');

const particles = [];
function spawnLetter(from, to, burst) {
  const ch = CHARS[(Math.random() * CHARS.length) | 0];
  const a = desks[from], b = desks[to];
  particles.push({
    ch,
    x: a.x + (Math.random() - 0.5) * 30,
    y: a.y + (Math.random() - 0.5) * 30,
    tx: b.x, ty: b.y,
    t: 0,
    dur: burst ? 1.2 + Math.random() * 1.5 : 6 + Math.random() * 8,
    wob: Math.random() * Math.PI * 2,
    wobAmp: 20 + Math.random() * 50,
    size: 10 + Math.random() * 14,
    color: a.color,
    alpha: 0
  });
}

// ambient drift: a letter every so often, alternating direction
let dir = 0;
setInterval(() => {
  spawnLetter(dir, 1 - dir, false);
  dir = 1 - dir;
}, 900);

canvas.addEventListener('pointerdown', (e) => {
  for (let i = 0; i < 24; i++) {
    spawnLetter(Math.random() < 0.5 ? 0 : 1, Math.random() < 0.5 ? 0 : 1, true);
    const p = particles[particles.length - 1];
    p.x = e.clientX + (Math.random() - 0.5) * 60;
    p.y = e.clientY + (Math.random() - 0.5) * 60;
  }
});

function drawDesk(d, time) {
  const flicker = 0.75 + Math.sin(time * 0.002 + d.x) * 0.1 + Math.random() * 0.05;
  const r = 90 * flicker;
  const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, r);
  g.addColorStop(0, `rgba(${d.color},0.55)`);
  g.addColorStop(0.4, `rgba(${d.color},0.18)`);
  g.addColorStop(1, `rgba(${d.color},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, Math.PI * 2); ctx.fill();
  // the little lamp dot
  ctx.fillStyle = `rgba(${d.color},0.9)`;
  ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, Math.PI * 2); ctx.fill();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  // trails
  ctx.fillStyle = 'rgba(6,7,13,0.08)';
  ctx.fillRect(0, 0, W, H);

  desks.forEach(d => drawDesk(d, now));

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt / p.dur;
    if (p.t >= 1) { particles.splice(i, 1); continue; }
    const eased = p.t < 0.5 ? 2 * p.t * p.t : 1 - Math.pow(-2 * p.t + 2, 2) / 2;
    const x = p.x + (p.tx - p.x) * eased + Math.sin(p.wob + now * 0.0012) * p.wobAmp * Math.sin(p.t * Math.PI);
    const y = p.y + (p.ty - p.y) * eased + Math.cos(p.wob * 1.3 + now * 0.001) * p.wobAmp * 0.6 * Math.sin(p.t * Math.PI);
    p.alpha = Math.sin(p.t * Math.PI) * 0.85;
    ctx.font = `${p.size}px Georgia, serif`;
    ctx.fillStyle = `rgba(${p.color},${p.alpha.toFixed(3)})`;
    ctx.shadowColor = `rgba(${p.color},0.8)`;
    ctx.shadowBlur = 12;
    ctx.fillText(p.ch, x, y);
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(frame);
}
ctx.fillStyle = '#06070d';
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(frame);
</script>
</body>
</html>
